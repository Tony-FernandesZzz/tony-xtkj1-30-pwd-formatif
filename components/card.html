<!-- lebar jika box sizing tidak di atur: 320px + 40px (padding) + 4px (border) = 364px -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid black;
            margin: 30px auto;
            background-color: white;
        }
        .card img {
            width: 100%;
            height: 160px;
            display: block;
        }
        .card h3 {
            color: darkblue;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 15px;
        }
        .card a {
            font-size: 15px;
            color: darkblue;
        }
        footer {
            text-align: center;
        }
    </style>

</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/background.png" alt="Gambar Proyek">
            <h3>Proyek Website Saya</h3>
            <p>
                Ini adalah salah satu proyek yang saya buat. Saya belajar membuat website menggunakan
                HTML dan CSS.
            </p>
            <a href="../index.html">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali Ke Beranda</a>
    </footer>
    
</body>
</html>
