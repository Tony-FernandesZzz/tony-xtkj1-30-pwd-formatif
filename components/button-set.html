<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol</title>

    <style>
        body {
            background-color: lightskyblue;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: black;
            font-size: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: blue;
            color: white;
        }
        .btn-secondary {
            background-color: rgb(255, 193, 7);
            color: #333333;
        }
        .btn-outline {
            background-color: white;
            border: 2px solid #333333;
            color: #333333;
        }
        .btn-send {
            background-color: rgba(40, 167, 69, 1);
            color: white;
        }
        .btn-primary:hover {
            background-color: navy;
        }
        .btn-secondary:hover {
            background-color: orange;
        }
        .btn-outline:hover {
            background-color: lightgray;
        }
        .btn-send:hover {
            background-color: green;
        }
    </style>
</head>
<body>
    
    <main>
        <h2>Kumpulan Tombol</h2>
        <div class="button-group">
            <button class="btn btn-primary">Lihat Proyek</button>
            <button class="btn btn-secondary">Unduh CV</button>
            <button class="btn btn-outline">Hubungi Saya</button>
            <button class="btn btn-send">Kirim Pesan</button>
        </div>

        <footer>
            <a href="../index.html">Kembali Ke Beranda  </a>
        </footer>
    </main>
</body>
</html>
